<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestRoutine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="appHeader">
      <h1>
          <svg class="app-logo" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#6366f1" stroke="#6366f1"/>
          </svg>
  <span class="rest-text">Rest</span><span class="routine-text">Routine</span>
</h1>
      <div class="header-actions">
        <button id="homeBtn" title="Home" class="icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </button>
        <button id="showCalendarBtn" title="Calendar" class="icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </button>
        <button id="settingsBtn" title="Settings" class="icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
      <div id="settingsMenu" class="hidden">
        <div class="settings-item">
          <label>Calendar</label>
          <select id="calendarToggle">
            <option value="gregorian">Gregorian</option>
            <option value="shamsi">Shamsi</option>
            <option value="hijri">Hijri</option>
          </select>
        </div>
        <div class="settings-item">
          <button id="exportBtn">Export Data</button>
        </div>
        <div class="settings-item">
          <button id="importBtn" class="settings-btn">Import Data</button>
          <input type="file" id="importFileInput" accept=".json" class="hidden">
        </div>
        <div class="settings-item settings-danger">
          <button id="restartBtn">Restart</button>
        </div>
        <div class="settings-divider"></div>
        <div class="settings-about">
          <div class="about-name">Arash Farzaneh</div>
          <div class="about-links">
            <a href="https://www.linkedin.com/in/xash" target="_blank" rel="noopener">LinkedIn</a>
            <a href="https://github.com/arashfarzaneh" target="_blank" rel="noopener">GitHub</a>
          </div>
        </div>
      </div>
    </header>

    <main id="mainView">
      <div id="statsBar"></div>
      <div id="entriesList"></div>
      <button id="expandBtn" class="hidden">Show All</button>
      <div id="emptyState">
        <p>No entries yet.</p>
        <p>Tap <strong>+</strong> to add your first night of sleep.</p>
      </div>
    </main>

    <section id="calendarView" class="hidden">
      <div id="calendarNav">
        <button id="prevMonthBtn">◀</button>
        <span id="calendarTitle"></span>
        <button id="nextMonthBtn">▶</button>
      </div>
      <div id="calendarGrid"></div>
      <div id="calendarEntryDetail"></div>
      <button id="backFromCalendarBtn">← Back</button>
    </section>

    <button id="fab">+</button>
  </div>

  <div id="modalOverlay" class="hidden">
    <div id="modal">
      <div id="entryDetail" class="hidden">
        <h2 id="detailTitle"></h2>
        <div id="detailBody"></div>
        <div class="detail-actions">
          <button id="detailEditBtn">Edit</button>
          <button id="detailDeleteBtn" class="btn-danger">Delete</button>
          <button id="detailCloseBtn">Close</button>
        </div>
      </div>
      <h2 id="modalTitle">New Entry</h2>
      <form id="entryForm">
        <div class="form-group">
          <label id="dateLabel">Date</label>
          <div class="date-inputs">
            <select id="entryYear"></select>
            <select id="entryMonth"></select>
            <select id="entryDay"></select>
          </div>
        </div>
        <div class="form-group">
          <label>Sleep Time</label>
          <input type="time" id="entrySleepStart" value="23:00">
        </div>
        <div class="form-group">
          <label>Wake Time</label>
          <input type="time" id="entrySleepEnd" value="07:00">
          <div id="timeError" class="time-error hidden">Wake time must be after sleep time</div>
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="entryNotes" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label>Mood</label>
          <div class="mood-picker" id="moodPicker"></div>
        </div>
        <div class="form-group">
          <label>Routines</label>
          <div id="routinesContainer"></div>
          <button type="button" id="addRoutineBtn" class="add-routine-btn">+ New Routine</button>
        </div>
        <div id="qualityPreview" class="hidden">
          <div id="qualityBarOuter">
            <div id="qualityBar"></div>
          </div>
          <span id="qualityScore"></span>
        </div>
        <div class="form-actions">
          <button type="submit" id="saveBtn">Save</button>
          <button type="button" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="lib/jalaali.js"></script>
  <script src="js/calendars.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
